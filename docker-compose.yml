version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: auravms_postgres
    restart: always
    environment:
      POSTGRES_DB: auravms_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  fastapi:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: auravms_fastapi
    restart: always
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_DB=auravms_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgrespassword
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
    depends_on:
      - db

  frontend:
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: auravms_react_app
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - fastapi

volumes:
  postgres_data:
