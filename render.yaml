services:
  # React SPA Frontend Static Site
  - type: web
    name: auravms-frontend
    env: static
    buildCommand: npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # Python FastAPI Backend Web Service
  - type: web
    name: auravms-fastapi-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: POSTGRES_DB
        value: auravms_db
      - key: POSTGRES_USER
        value: postgres
      - key: POSTGRES_PASSWORD
        value: postgrespassword
      - key: POSTGRES_HOST
        fromDatabase:
          name: auravms-postgres-db
          property: host

databases:
  - name: auravms-postgres-db
    databaseName: auravms_db
    user: postgres
